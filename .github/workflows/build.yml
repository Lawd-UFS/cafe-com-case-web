name: Build

on:
  pull_request:
  push:
    branches: [main]

# Cancels the previous run when a new commit is pushed to the same PR.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run build
